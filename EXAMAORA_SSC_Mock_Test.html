['240 का 25% कितना है?',['40','50','60','70'],2,'240×25/100=60।'],['यदि 20% किसी संख्या का 50 है, संख्या?',['200','250','300','350'],1,'50×100/20=250।'],['12 और 18 का LCM?',['24','36','48','72'],1,'12=2²×3, 18=2×3²; LCM=36।'],['15% लाभ पर ₹800 की वस्तु का विक्रय मूल्य?',['₹880','₹900','₹920','₹950'],0,'800×1.15=₹920।'],['₹1000 पर 10% वार्षिक दर से 2 वर्ष का साधारण ब्याज?',['₹100','₹150','₹200','₹250'],2,'SI=1000×10×2/100=₹200।'],['5 संख्याओं का औसत 18 है, योग?',['80','85','90','95'],2,'योग=औसत×संख्या=18×5=90।'],['एक वस्तु ₹600 में खरीदी और ₹540 में बेची। हानि %?',['5%','10%','15%','20%'],1,'हानि 60; 60/600×100=10%।'],['3:5 अनुपात में कुल 64 बाँटें, छोटा भाग?',['18','20','24','30'],2,'कुल भाग 8; 64/8×3=24।'],['√144 = ?',['10','11','12','14'],2,'12×12=144।'],['एक वाहन 60 km/h से 2.5 घंटे चलता है। दूरी?',['120','140','150','180 km'],2,'दूरी=60×2.5=150 km।'],['A काम 12 दिन में करता है। एक दिन का काम?',['1/10','1/12','1/15','1/20'],1,'एक दिन का काम 1/12।'],['किसी संख्या में 40% वृद्धि कर 140 हुआ। मूल संख्या?',['90','100','110','120'],1,'140/1.4=100।'],['7² + 8² = ?',['100','105','113','121'],2,'49+64=113।'],['₹500 पर 20% छूट के बाद मूल्य?',['₹350','₹380','₹400','₹420'],2,'500 का 20%=100; 500−100=400।'],['12, 15, 18 का औसत?',['14','15','16','17'],1,'योग 45; औसत 15।'],['एक ट्रेन 90 km/h से 2 घंटे में दूरी?',['160','170','180','190 km'],2,'90×2=180 km।'],['24 और 36 का HCF?',['6','8','12','18'],2,'दोनों का सबसे बड़ा सामान्य भाजक 12।'],['यदि x+7=19, x?',['10','11','12','13'],2,'19−7=12।'],['वृत्त की परिधि (r=7, π=22/7)?',['22','44','49','154'],1,'2πr=2×22/7×7=44।'],['60 का 3/4?',['35','40','45','50'],2,'60×3/4=45।'],['2.5×4 = ?',['8','9','10','12'],2,'2.5×4=10।'],['₹1500 पर 8% वार्षिक दर से 1 वर्ष का ब्याज?',['₹100','₹110','₹120','₹130'],2,'1500×8/100=120।'],['एक आयत 12 cm × 5 cm का क्षेत्रफल?',['50','55','60','65'],2,'12×5=60 cm²।'],['किसी संख्या का 5 गुना 65 है। संख्या?',['11','12','13','14'],2,'65÷5=13।'],['45 मिनट, एक घंटे का कितना भाग?',['1/4','1/2','3/4','2/3'],2,'45/60=3/4।']];
// English questions
const E=[
['Choose the synonym of “Abundant”.',['Scarce','Plentiful','Tiny','Weak'],1,'Abundant means plentiful or available in large quantity.'],['Choose the antonym of “Ancient”.',['Old','Historic','Modern','Past'],2,'Ancient का विलोम Modern है।'],['Fill in: She ___ to school every day.',['go','going','goes','gone'],2,'He/She/It के साथ simple present में goes।'],['Choose correct spelling.',['Accomodation','Accommodation','Acomodation','Accommadation'],1,'Correct spelling: Accommodation.'],['Identify the noun: “Honesty is the best policy.”',['best','is','Honesty','the'],2,'Honesty एक abstract noun है।'],['Choose correct article: He is ___ honest man.',['a','an','the','no article'],1,'Honest में h silent है, vowel sound से an।'],['Meaning of “Brief”.',['Short','Wide','Late','Bright'],0,'Brief means short.'],['Choose correct passive: They make cars.',['Cars made them.','Cars are made by them.','Cars have them.','Cars making.'],1,'Simple present passive: object + are + V3.'],['Fill in: Neither Ram nor Shyam ___ present.',['are','were','is','have'],2,'Neither/nor में निकट subject Shyam singular है, is।'],['Plural of “Child”.',['Childs','Children','Childes','Childrens'],1,'Child का plural Children।'],['Choose the correct sentence.',['He do not know.','He does not know.','He don’t knows.','He not know.'],1,'He के साथ does not + base verb।'],['“Once in a blue moon” means:',['Very often','Rarely','Immediately','At night'],1,'इस idiom का अर्थ बहुत कम/कभी-कभार।'],['Fill in: I have lived here ___ 2020.',['for','from','since','by'],2,'Since किसी निश्चित शुरुआत के समय के लिए।'],['Choose antonym of “Expand”.',['Extend','Enlarge','Contract','Spread'],2,'Expand का opposite Contract।'],['Correct spelling:',['Separate','Seperate','Separete','Seprate'],0,'Correct spelling Separate।'],['Identify adjective: “She wore a beautiful dress.”',['She','wore','beautiful','dress'],2,'Beautiful, dress की विशेषता बताता है।'],['Choose synonym of “Rapid”.',['Slow','Quick','Calm','Small'],1,'Rapid means quick/fast.'],['Fill in: The train arrived ___ time.',['in','on','at','by'],1,'On time का अर्थ समय पर।'],['Change to indirect: He said, “I am tired.”',['He said that I am tired.','He said that he was tired.','He says tired.','He told tired.'],1,'Reported speech में am→was और I→he (context) होता है।'],['One word: A person who writes poems.',['Painter','Poet','Actor','Editor'],1,'Poet = कविता लिखने वाला।'],['Choose correct preposition: She is good ___ maths.',['in','at','on','for'],1,'Good at किसी skill/subject में अच्छा।'],['Meaning of “Reluctant”.',['Eager','Unwilling','Happy','Certain'],1,'Reluctant means unwilling/अनिच्छुक।'],['Choose correct verb: Each of the boys ___ a pen.',['have','has','are having','were'],1,'Each singular है, इसलिए has।'],['Antonym of “Victory”.',['Success','Triumph','Defeat','Achievement'],2,'Victory का विलोम Defeat।']];
for(let s=0;s<4;s++){let arr=[R,G,M,E][s];arr.forEach((q,i)=>questions.push({section:s,text:q[0],options:q[1],answer:q[2],explain:q[3]}));}
let idx=0,answers=Array(100).fill(null),marked=Array(100).fill(false),time=3600,done=false;
const $=id=>document.getElementById(id);
function fmt(){return `${String(Math.floor(time/60)).padStart(2,'0')}:${String(time%60).padStart(2,'0')}`}
function render(){let q=questions[idx];$('qnum').textContent=`Question ${idx+1} / 100`;$('sectionName').textContent=sections[q.section];$('question').textContent=q.text;$('opts').innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt'+(answers[idx]===i?' selected':'');b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${o}`;b.onclick=()=>{answers[idx]=i;render()};$('opts').appendChild(b)});document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.section===q.section));renderPalette();$('progress').textContent=`Answered: ${answers.filter(x=>x!==null).length} / 100`}
function renderPalette(){let p=$('palette');p.innerHTML='';questions.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className='pbtn'+(answers[i]!==null?' answered':'')+(marked[i]?' review':'')+(idx===i?' current':'');b.onclick=()=>{idx=i;render()};p.appendChild(b)})}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{let s=+t.dataset.section;idx=s*25;render()});$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<99){idx++;render()}};$('clear').onclick=()=>{answers[idx]=null;render()};$('mark').onclick=()=>{marked[idx]=!marked[idx];if(idx<99)idx++;render()};
function submit(){if(done)return;done=true;clearInterval(timerInterval);let correct=0,wrong=0,skip=0;questions.forEach((q,i)=>{if(answers[i]===null)skip++;else if(answers[i]===q.answer)correct++;else wrong++});let score=correct*2-wrong*.5;$('exam').style.display='none';$('result').style.display='block';$('score').textContent=`${score.toFixed(2)} / 200`;$('stats').innerHTML=`<div class="stat"><b>${correct}</b><br>Correct</div><div class="stat"><b>${wrong}</b><br>Wrong</div><div class="stat"><b>${skip}</b><br>Skipped</div><div class="stat"><b>${(correct/100*100).toFixed(1)}%</b><br>Accuracy (of total)</div><div class="stat"><b>${(correct*2).toFixed(0)}</b><br>Marks gained</div><div class="stat"><b>${(wrong*.5).toFixed(2)}</b><br>Negative marks</div>`;let list=$('reviewlist');list.innerHTML='<h3>Answer Review</h3>';questions.forEach((q,i)=>{let d=document.createElement('div');d.className='reviewitem';let status=answers[i]===null?'Skipped':answers[i]===q.answer?'Correct':'Wrong';d.innerHTML=`<b>Q${i+1} (${sections[q.section]})</b> — <span class="${status==='Correct'?'correct':status==='Wrong'?'wrong':''}">${status}</span><p>${q.text}</p><p>Your answer: ${answers[i]===null?'Not answered':q.options[answers[i]]}</p><p>Correct: <b>${q.options[q.answer]}</b></p><p>Explanation: ${q.explain}</p>`;list.appendChild(d)});window.scrollTo(0,0)}
$('submit').onclick=()=>{if(confirm('क्या आप टेस्ट सबमिट करना चाहते हैं?'))submit()};let timerInterval=setInterval(()=>{if(done)return;time--; $('timer').textContent=fmt();if(time<=0){alert('समय समाप्त! टेस्ट अपने आप सबमिट हो रहा है।');submit()}},1000);render();
</script></body></html>
